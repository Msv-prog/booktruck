<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Registro de transportador - BookTruck</title>
    <th:block th:replace="~{fragments/head :: css}"></th:block>
</head>
<body>
<div class="auth-split">
    <div class="auth-split-brand">
        <a th:href="@{/}" class="brand-lockup brand-lockup-light">
            <img th:src="@{/images/logobt.png}" alt="BookTruck" class="logo-img">
            <span class="brand-name">BookTruck</span>
        </a>
        <h2>Encuentra tu próxima carga.</h2>
        <p>Crea tu cuenta de transportador en dos pasos: primero tus datos de acceso, luego tu información personal.</p>
    </div>
    <div class="auth-split-form">
        <div class="auth-card">
            <div class="auth-logo brand-lockup">
                <img th:src="@{/images/logobt.png}" alt="BookTruck" class="logo-img">
                <span class="brand-name">BookTruck</span>
            </div>
            <h1>Registro de transportador</h1>

            <div class="wizard-steps">
                <div class="wizard-step-dot is-active" data-dot="1"><span class="num">1</span> Acceso</div>
                <div class="wizard-step-line"></div>
                <div class="wizard-step-dot" data-dot="2"><span class="num">2</span> Datos personales</div>
            </div>

            <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

            <form th:action="@{/auth/registro/transportador}" th:object="${form}" method="post" id="form-registro">
                <div class="wizard-panel" data-step="1">
                    <div class="form-group">
                        <label for="email">Correo electrónico</label>
                        <input type="email" id="email" th:field="*{email}" class="form-control" required autofocus>
                    </div>
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" th:field="*{password}" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="confirmarPassword">Confirmar contraseña</label>
                        <input type="password" id="confirmarPassword" th:field="*{confirmarPassword}" class="form-control" required>
                    </div>
                    <div class="wizard-actions">
                        <button type="button" class="btn btn-primary wizard-next">Siguiente</button>
                    </div>
                </div>

                <div class="wizard-panel" data-step="2" hidden>
                    <div class="form-group">
                        <label for="cedula">Cédula</label>
                        <input type="text" id="cedula" th:field="*{cedula}" class="form-control" maxlength="10" inputmode="numeric" required>
                    </div>
                    <div class="form-group">
                        <label for="nombreCompleto">Nombre completo</label>
                        <input type="text" id="nombreCompleto" th:field="*{nombreCompleto}" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="telefono">Teléfono</label>
                        <input type="text" id="telefono" th:field="*{telefono}" class="form-control" maxlength="10" inputmode="numeric" required>
                    </div>
                    <div class="form-group">
                        <label for="licencia">Licencia de conducción</label>
                        <select id="licencia" th:field="*{licencia}" class="form-control" required>
                            <option value="">Selecciona una categoría</option>
                            <option value="C1">C1 - carga liviana (hasta 3.500 kg de peso bruto)</option>
                            <option value="C2">C2 - camión rígido (hasta 10.000 kg de peso bruto)</option>
                            <option value="C3">C3 - articulados y camiones de más de 10.000 kg</option>
                        </select>
                    </div>
                    <div class="wizard-actions">
                        <button type="button" class="btn btn-secondary wizard-back">Atrás</button>
                        <button type="submit" class="btn btn-primary">Crear cuenta</button>
                    </div>
                </div>
            </form>

            <div class="auth-footer">
                ¿Ya tienes cuenta? <a th:href="@{/auth/login}">Inicia sesión</a>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/registro-wizard.js}"></script>
</body>
</html>
