<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Acceso no permitido - BookTruck</title>
    <th:block th:replace="~{fragments/head :: css}"></th:block>
</head>
<body>
<div class="error-page">
    <div>
        <div class="brand-lockup">
            <img th:src="@{/images/logobt.png}" alt="BookTruck" class="logo-img">
            <span class="brand-name">BookTruck</span>
        </div>
        <div class="error-page-code">403</div>
        <h1>No tienes acceso a esta sección</h1>
        <p>Tu cuenta no tiene permisos para ver esta página.</p>
        <a th:href="@{/}" class="btn btn-primary btn-auto">Volver al inicio</a>
    </div>
</div>
</body>
</html>
