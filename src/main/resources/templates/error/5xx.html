<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Error del servidor - BookTruck</title>
    <th:block th:replace="~{fragments/head :: css}"></th:block>
</head>
<body>
<div class="error-page">
    <div>
        <div class="brand-lockup">
            <img th:src="@{/images/logobt.png}" alt="BookTruck" class="logo-img">
            <span class="brand-name">BookTruck</span>
        </div>
        <div class="error-page-code">500</div>
        <h1>Algo salió mal de nuestro lado</h1>
        <p>Estamos teniendo un problema técnico. Intenta de nuevo en unos minutos.</p>
        <a th:href="@{/}" class="btn btn-primary btn-auto">Volver al inicio</a>
    </div>
</div>
</body>
</html>
