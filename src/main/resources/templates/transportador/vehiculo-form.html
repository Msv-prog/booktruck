<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Registrar vehículo - BookTruck</title>
    <th:block th:replace="~{fragments/head :: css}"></th:block>
</head>
<body>
<div th:replace="~{fragments/navbar-transportador :: nav}"></div>

<main class="app-content">
    <nav th:replace="~{fragments/breadcrumb :: trail(@{/transportador/vehiculos}, 'Vehículos', 'Registrar vehículo')}"></nav>
    <h1>Registrar vehículo</h1>
    <p class="app-subtitle">Completa los datos del vehículo.</p>

    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

    <section class="app-section">
        <form th:action="@{/transportador/vehiculos/nuevo}" th:object="${form}" method="post">
            <div class="form-group">
                <label for="tipoVehiculo">Tipo de vehículo</label>
                <select id="tipoVehiculo" th:field="*{tipoVehiculo}" class="form-control" required>
                    <option value="">Selecciona una opción</option>
                    <option value="SENCILLO">Sencillo</option>
                    <option value="ARTICULADO">Articulado (tractomula)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="placa">Placa</label>
                <input type="text" id="placa" th:field="*{placa}" class="form-control" maxlength="6" placeholder="Ej: ABC123" required>
                <small class="app-subtitle" id="placa-ayuda">Vehículo sencillo: 3 letras + 3 números (ej: ABC123).</small>
            </div>
            <div class="form-group">
                <label for="marcaSelect">Marca</label>
                <select id="marcaSelect" class="form-control" data-lista="MARCAS_VEHICULO" data-target="marca"></select>
                <input type="text" id="marcaOtro" class="form-control" placeholder="Especifica la marca" hidden style="margin-top: 8px;">
                <input type="hidden" id="marca" th:field="*{marca}">
            </div>
            <div class="form-group">
                <label for="capacidadToneladas">Capacidad (toneladas)</label>
                <input type="number" step="0.01" min="0.01" id="capacidadToneladas" th:field="*{capacidadToneladas}" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="pesoBrutoKg">Peso bruto vehicular (kg)</label>
                <input type="number" step="1" min="1" max="60000" id="pesoBrutoKg" th:field="*{pesoBrutoKg}" class="form-control"
                       placeholder="Ej: 3500" required>
                <small class="app-subtitle" id="peso-ayuda"
                       th:attr="data-licencia=${transportador.licencia}">
                    Vehículo vacío + carga máxima. Aparece en la licencia de tránsito.
                </small>
            </div>
            <div class="form-group">
                <label for="tipoCarroceria">Tipo de carrocería</label>
                <select id="tipoCarroceria" th:field="*{tipoCarroceria}" class="form-control" required>
                    <option value="">Selecciona un tipo</option>
                    <option value="ESTACAS">Estacas</option>
                    <option value="FURGON">Furgón</option>
                    <option value="PLANCHA">Plancha</option>
                    <option value="CONTENEDOR">Contenedor</option>
                    <option value="REFRIGERADO">Refrigerado</option>
                    <option value="TOLVA">Tolva</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Registrar vehículo</button>
        </form>
    </section>

    <p class="app-back-link"><a th:href="@{/transportador/vehiculos}">&larr; Volver a vehículos</a></p>
    <footer th:replace="~{fragments/footer-app :: footer}"></footer>
</main>
<script th:src="@{/js/listas-colombia.js}"></script>
<script th:src="@{/js/select-otro.js}"></script>
<script th:inline="none">
document.addEventListener('DOMContentLoaded', function () {
    var tipoSelect = document.getElementById('tipoVehiculo');
    var placaInput = document.getElementById('placa');
    var placaAyuda = document.getElementById('placa-ayuda');

    var FORMATOS = {
        SENCILLO: {
            regex: /^[A-Za-z]{3}[0-9]{3}$/,
            mensaje: 'La placa debe tener el formato de 3 letras y 3 números (ej: ABC123).',
            placeholder: 'Ej: ABC123'
        },
        ARTICULADO: {
            regex: /^[RS][0-9]{5}$/,
            mensaje: 'La placa de un remolque/semirremolque debe ser R o S seguido de 5 números (ej: S67890).',
            placeholder: 'Ej: S67890'
        }
    };

    function aplicarFormato() {
        var formato = FORMATOS[tipoSelect.value] || FORMATOS.SENCILLO;
        placaInput.placeholder = formato.placeholder;
        placaAyuda.textContent = tipoSelect.value === 'ARTICULADO'
            ? 'Vehículo articulado: letra R o S + 5 números (ej: S67890).'
            : 'Vehículo sencillo: 3 letras + 3 números (ej: ABC123).';
        if (window.reglasValidacion && window.reglasValidacion.placa) {
            window.reglasValidacion.placa.regex = formato.regex;
            window.reglasValidacion.placa.mensaje = formato.mensaje;
        }
    }

    tipoSelect.addEventListener('change', aplicarFormato);
    aplicarFormato();

    // Licencia mínima según el peso bruto (misma regla que CategoriaLicencia en el servidor)
    var pesoInput = document.getElementById('pesoBrutoKg');
    var pesoAyuda = document.getElementById('peso-ayuda');
    var licenciaPropia = pesoAyuda.dataset.licencia;
    var textoBase = pesoAyuda.textContent.trim();

    function licenciaRequerida() {
        if (tipoSelect.value === 'ARTICULADO') return 'C3';
        var peso = parseInt(pesoInput.value, 10);
        if (!peso) return null;
        if (peso <= 3500) return 'C1';
        if (peso <= 10000) return 'C2';
        return 'C3';
    }

    function mostrarLicencia() {
        var requerida = licenciaRequerida();
        pesoAyuda.classList.remove('texto-error');
        if (!requerida) {
            pesoAyuda.textContent = textoBase;
            return;
        }
        var alcanza = licenciaPropia && licenciaPropia >= requerida;
        pesoAyuda.textContent = 'Este vehículo requiere licencia ' + requerida + '. '
            + (alcanza ? 'Tu licencia ' + licenciaPropia + ' te habilita.'
                       : 'Tu licencia es ' + licenciaPropia + ': no podrás registrarlo.');
        if (!alcanza) pesoAyuda.classList.add('texto-error');
    }

    pesoInput.addEventListener('input', mostrarLicencia);
    tipoSelect.addEventListener('change', mostrarLicencia);
    mostrarLicencia();
});
</script>
</body>
</html>
