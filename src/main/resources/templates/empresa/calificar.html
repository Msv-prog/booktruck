<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Calificar transportador - BookTruck</title>
    <th:block th:replace="~{fragments/head :: css}"></th:block>
</head>
<body>
<div th:replace="~{fragments/navbar-empresa :: nav}"></div>

<main class="app-content">
    <nav th:replace="~{fragments/breadcrumb :: trail(@{/empresa/viajes}, 'Viajes', 'Calificar transportador')}"></nav>
    <h1>Calificar transportador</h1>
    <p class="app-subtitle">
        Viaje: <span th:text="${viaje.carga.origen}"></span> &rarr; <span th:text="${viaje.carga.destino}"></span>
        &middot; Transportador: <span th:text="${viaje.transportador.nombreCompleto}"></span>
    </p>

    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

    <section class="app-section">
        <form th:action="@{/empresa/viajes/{id}/calificar(id=${viaje.id})}" th:object="${form}" method="post">
            <div class="form-group">
                <label for="puntuacion">Puntuación</label>
                <select id="puntuacion" th:field="*{puntuacion}" class="form-control" required>
                    <option value="">Selecciona una puntuación</option>
                    <option value="5">5 - Excelente</option>
                    <option value="4">4 - Muy bueno</option>
                    <option value="3">3 - Bueno</option>
                    <option value="2">2 - Regular</option>
                    <option value="1">1 - Malo</option>
                </select>
            </div>
            <div class="form-group">
                <label for="comentario">Comentario (opcional)</label>
                <textarea id="comentario" th:field="*{comentario}" class="form-control" rows="4" maxlength="500"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Enviar calificación</button>
        </form>
    </section>

    <p class="app-back-link"><a th:href="@{/empresa/viajes}">&larr; Volver a viajes</a></p>
    <footer th:replace="~{fragments/footer-app :: footer}"></footer>
</main>
</body>
</html>
