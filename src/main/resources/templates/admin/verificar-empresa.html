<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Verificar empresa - BookTruck Admin</title>
    <th:block th:replace="~{fragments/head :: css}"></th:block>
</head>
<body>
<div th:replace="~{fragments/navbar-admin :: nav}"></div>

<main class="app-content">
    <nav th:replace="~{fragments/breadcrumb :: trail(@{/admin/empresas}, 'Empresas', 'Revisar documentos')}"></nav>
    <h1>Revisar documentos</h1>
    <p class="app-subtitle">
        <span th:text="${empresa.razonSocial}"></span> ·
        NIT <span th:text="${empresa.nit}"></span> ·
        <span th:text="${empresa.usuario.email}"></span>
    </p>

    <div class="alert alert-success" th:if="${exito}" th:text="${exito}"></div>
    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

    <section class="app-section">
        <div th:replace="~{fragments/documentos :: resumen-estado(${estadoDocumentos})}"></div>
        <div th:replace="~{fragments/documentos :: revision(${tiposDocumento}, ${documentos})}"></div>
    </section>

    <p class="app-back-link"><a th:href="@{/admin/empresas}">&larr; Volver a empresas</a></p>
    <footer th:replace="~{fragments/footer-app :: footer}"></footer>
</main>
</body>
</html>
