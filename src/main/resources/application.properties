spring.application.name=booktruck
server.port=8080

# --- Base de datos ---
# La base de datos y las tablas se crean con booktruck_db.sql, NO por Hibernate.
spring.datasource.url=jdbc:mysql://localhost:3306/booktruck_db?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Thymeleaf ---
# recarga plantillas sin reiniciar la app.
spring.thymeleaf.cache=false

# --- Subida de archivos (documentos de verificación) ---
# El límite real para el usuario es 5 MB y lo valida FileStorageService con un mensaje claro.
# Aquí se deja un margen técnico mayor para que esos archivos lleguen a esa validación en lugar de
# cortarse antes (Spring Security necesita leer el formulario para validar el token CSRF).
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
# Tomcat lee el cuerpo completo de peticiones rechazadas (hasta este tamaño) en vez de cortar la conexión
server.tomcat.max-swallow-size=25MB

# --- Comisión simulada de BookTruck ---
# Porcentaje del monto de la oferta aceptada que se descuenta al transportador cuando el viaje se finaliza.
booktruck.comision.porcentaje=3